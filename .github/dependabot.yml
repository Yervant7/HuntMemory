version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Rust dependencies in hmem workspace
  - package-ecosystem: "cargo"
    directory: "/app/src/main/hmem"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Gradle & Android dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
